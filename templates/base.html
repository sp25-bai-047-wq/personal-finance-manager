<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Finance Manager{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">◆ Finance Manager</div>
      <a class="nav-link {{ 'active' if active == 'dashboard' }}" href="{{ url_for('dashboard') }}">🏠 Dashboard</a>
      <a class="nav-link {{ 'active' if active == 'add_income' }}" href="{{ url_for('add_income') }}">📈 Add Income</a>
      <a class="nav-link {{ 'active' if active == 'add_expense' }}" href="{{ url_for('add_expense') }}">📉 Add Expense</a>
      <a class="nav-link {{ 'active' if active == 'budget' }}" href="{{ url_for('set_budget') }}">🗂 Budget</a>
      <a class="nav-link {{ 'active' if active == 'reports' }}" href="{{ url_for('reports') }}">📊 Reports</a>
      <div class="sidebar-footer">
        <a class="nav-link" href="{{ url_for('logout') }}">⏻ Log out</a>
      </div>
    </aside>
    <main class="main">
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endwith %}
      {% block content %}{% endblock %}
    </main>
  </div>
</body>
</html>

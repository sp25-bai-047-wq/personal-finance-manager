{% extends "base.html" %}
{% block title %}Add Income · Finance Manager{% endblock %}
{% block content %}
  <div class="page-head">
    <h1>Add Income</h1>
    <div class="sub">Log a new payment coming in.</div>
  </div>

  <div class="form-panel">
    <div class="form-icon income">📈</div>
    <form method="POST">
      <div class="field">
        <label for="amount">Amount</label>
        <input type="number" step="0.01" min="0" id="amount" name="amount" placeholder="0.00" required>
      </div>
      <div class="field">
        <label for="source">Source</label>
        <select id="source" name="source">
          {% for s in sources %}
            <option value="{{ s }}">{{ s }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="field">
        <label for="date">Date</label>
        <input type="date" id="date" name="date" value="{{ today }}">
      </div>
      <div class="field">
        <label for="description">Description (optional)</label>
        <textarea id="description" name="description" rows="3" placeholder="Add a note..."></textarea>
      </div>
      <button type="submit" class="btn btn-income">Save Income</button>
    </form>
  </div>
{% endblock %}

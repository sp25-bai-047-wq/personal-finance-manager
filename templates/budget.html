{% extends "base.html" %}
{% block title %}Budget · Finance Manager{% endblock %}
{% block content %}
  <div class="page-head">
    <h1>Monthly Budget</h1>
    <div class="sub">Set a spending limit and track how close you are to it.</div>
  </div>

  <div class="form-panel">
    <div class="form-icon budget">🗂</div>
    <form method="POST">
      <div class="field">
        <label for="monthly_amount">Budget Amount</label>
        <input type="number" step="0.01" min="0" id="monthly_amount" name="monthly_amount"
               value="{{ budget.monthly_amount if budget.monthly_amount else '' }}" placeholder="Enter monthly budget" required>
      </div>
      <button type="submit" class="btn btn-budget">Save Budget</button>
    </form>

    <div class="budget-current">
      Current Expense: <strong>₹{{ "%.2f"|format(total_expense) }}</strong>
    </div>

    {% if exceeded %}
      <div class="budget-warning">⚠ Budget Exceeded</div>
    {% endif %}
  </div>
{% endblock %}
